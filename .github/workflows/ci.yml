name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches:
      - main
      - pak-tajarat/branding-and-hardening

jobs:
  frontend-build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Generate Prisma client
        run: npx prisma generate
        env:
          DATABASE_URL: mysql://ci:ci@127.0.0.1:3306/pak_tajarat
      - name: Build Next.js application
        run: npm run build
        env:
          DATABASE_URL: mysql://ci:ci@127.0.0.1:3306/pak_tajarat
          NEXTAUTH_SECRET: ci-only-not-a-production-secret
          NEXTAUTH_URL: http://localhost:3000
          NEXT_PUBLIC_API_BASE_URL: http://localhost:3001

  backend-syntax:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: server/package-lock.json
      - name: Install backend dependencies
        run: npm ci --prefix server
      - name: Check backend JavaScript syntax
        shell: bash
        run: |
          while IFS= read -r -d '' file; do
            node --check "$file"
          done < <(find server -type f -name '*.js' -not -path '*/node_modules/*' -print0)
